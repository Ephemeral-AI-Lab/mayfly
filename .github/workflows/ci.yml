# R0 (release roadmap): test/typecheck/lint gate for the workspace packages.
# Runs on every main push and PR (except website-only PRs — those are
# covered by website-pages.yml's build check). Install is pinned by the
# root packageManager field (pnpm/action-setup reads it) with a frozen
# lockfile; node mirrors the website workflow's PRIMARY_NODE_VERSION.
# The check job runs `pnpm run check` (script/check.mjs, roadmap Phase 2b):
# a pull request runs the pr tier on what its change can reach, a push to main,
# the nightly run, and a manual run take the full tier (every check, one vitest
# run with retained-row verification and the coverage floor, the smoke, and the
# bench). The report lands in the job summary and as an artifact.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - website/**
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  platform:
    name: native platform regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: native launcher, command, and clipboard regressions
        run: >-
          pnpm exec vitest run
          packages/cli/tests
          packages/mayfly/tests/interaction/updater-profile.spec.ts
          packages/mayfly/tests/interaction/clipboard-runner.spec.ts
          packages/mayfly/tests/interaction/platform-command.spec.ts
          packages/mayfly/tests/interaction/file-mention.spec.ts
          packages/mayfly/tests/core/search-input.spec.ts
          packages/mayfly/tests/transcript/status-cwd.spec.ts
      - name: prepare native user service environment
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo loginctl enable-linger "$(id -u)"
            sudo systemctl start "user@$(id -u).service"
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            launchctl print "gui/$(id -u)" >/dev/null
          fi
      - name: native background Host and independent PTY workflows
        run: node script/smoke-platform-pty.mjs
        env:
          MAYFLY_SMOKE_LAUNCHER: ${{ github.workspace }}/packages/cli/lib/bin.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-platform-${{ runner.os }}
          path: .artifacts/platform-pty

  check:
    name: check (${{ github.event_name == 'pull_request' && 'pr' || 'full' }} tier)
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The whole history: the pr tier diffs against the merge base with the target branch.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Split verification resolves the exact packaged CLI runtime; the immutable
      # reference installs its own historical Harness in an isolated graph.
      # A pull request also reports the changed source lines no selected spec
      # ran (advice, not a gate). The perf slack scales the ceilings for a shared runner.
      - name: pnpm run check
        run: >-
          pnpm run check --
          --tier ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
          --base origin/${{ github.base_ref || 'main' }}
          --verbose
          ${{ github.event_name == 'pull_request' && '--coverage-advice' || '' }}
        env:
          MAYFLY_PERF_SLACK: '3'
      - name: report
        if: ${{ !cancelled() }}
        run: cat .artifacts/verify/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: verify-report
          path: .artifacts/verify/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: split-reference-evidence
          path: |
            .artifacts/split-parity/all/**/*.grid
            .artifacts/split-parity/all/**/report.json
            .artifacts/split-parity/all/**/reference.json
            .artifacts/split-parity/all/**/capture-evidence.json
            .artifacts/split-parity/all/**/native-evidence-*.json
            .artifacts/split-parity/all/**/*.ansi
            .artifacts/split-parity/all/**/exit.json
            .artifacts/split-parity/all/**/session.v4.jsonl.zstd
            .artifacts/split-parity/all/**/storages/session_projcache/sessions/*.json
          if-no-files-found: ignore
