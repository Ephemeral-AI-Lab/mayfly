# Build, typecheck, lint, and test gate for the workspace packages.
# Runs on every main push and PR (except website-only PRs — those are
# covered by website-pages.yml's build check). Install is pinned by the
# root packageManager field (pnpm/action-setup reads it) with a frozen
# lockfile; node mirrors the website workflow's PRIMARY_NODE_VERSION.
# `pnpm run check` is the whole gate: build -> typecheck -> lint -> vitest.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - website/**
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  platform:
    name: native platform regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: native launcher, command, and clipboard regressions
        run: >-
          pnpm exec vitest run
          packages/cli/tests/translate.spec.ts
          packages/cli/tests/runtime.spec.ts
          packages/cli/tests/runtime-lock.spec.ts
          packages/cli/tests/main.spec.ts
          packages/mayfly/tests/interaction/updater-profile.spec.ts
          packages/mayfly/tests/interaction/clipboard-runner.spec.ts
          packages/mayfly/tests/interaction/platform-command.spec.ts
          packages/mayfly/tests/core/search-input.spec.ts
          packages/mayfly/tests/transcript/status-cwd.spec.ts

  check:
    name: check
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
