# Publish verified tarballs to a candidate channel, exercise exact registry
# installs, then promote dist-tags. Every transition is safely rerunnable.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact Mayfly version to release (for example 0.1.1-rc.1)'
        required: true
        type: string
      promote_only:
        description: 'Skip build/publish/verification and promote an existing candidate artifact'
        required: false
        default: false
        type: boolean
      source_run_id:
        description: 'Workflow run ID containing the npm-tarballs artifact (required for promote-only)'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  candidate:
    name: gate + publish candidate
    if: ${{ inputs.promote_only != true }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: guard tag, version, and main ancestry
        run: |
          VERSION="${RELEASE_VERSION#v}"
          MANIFEST=$(node -p "require('./packages/mayfly/package.json').version")
          test "$VERSION" = "$MANIFEST" || { echo "tag $VERSION != manifest $MANIFEST" >&2; exit 1; }
          # Test packages are intentionally published from their acceptance
          # branch before merge; stable/rc tags remain main-only.
          if [[ "$VERSION" != *-test.* ]]; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main || { echo 'release tag commit is not on main' >&2; exit 1; }
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:preflight "${RELEASE_VERSION#v}"
      - name: full architecture and split acceptance gate
        run: pnpm run verify:full -- --verbose
      - run: pnpm shots:check
      - run: pnpm website:build
      - run: pnpm check:pack
      - run: pnpm release:preflight --artifact "${RELEASE_VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: |
            .artifacts/pack/*.tgz
            .artifacts/pack/index.json
          if-no-files-found: error
      # OIDC migration replaces this isolated auth step only. Candidate and
      # promotion behavior deliberately know nothing about credential source.
      - name: verify npm publisher identity
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            if timeout 30 npm whoami --registry=https://registry.npmjs.org; then exit 0; fi
            echo "npm whoami failed (attempt ${attempt}/10); retrying after the registry settles"
            sleep 30
          done
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: node script/release-packages.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Staged publishing can accept a publish without making it installable.
      # Surface the maintainer approval queue in the failing run's log. Bound
      # the npx download so a registry outage cannot hang the job for hours.
      - name: list npm staged releases awaiting approval
        if: failure()
        run: timeout 180 npx --yes npm@12 stage list || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry-install:
    name: registry install (${{ matrix.os }}, node ${{ matrix.node }})
    needs: candidate
    if: ${{ inputs.promote_only != true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
    runs-on: ${{ matrix.os }}
    env:
      MAYFLY_HOME: ${{ github.workspace }}/.mayfly-candidate-home
      MAYFLY_SMOKE_PROFILE: mayfly-release
      # Skip first-run credential onboarding in the isolated PTY smoke. This
      # value never reaches a model request; the smoke exits immediately.
      DEEPSEEK_API_KEY: mayfly-release-smoke-key
      # Exact candidate versions are intentionally younger than pnpm 11's
      # policy window. This exception exists only in the release verifier.
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - name: install exact candidate CLI
        shell: bash
        run: npm install -g "@ephemeral-ai/mayfly-cli@${RELEASE_VERSION#v}"
      - name: verify exact CLI version
        shell: bash
        run: test "$(mayfly -V | awk '{print $2}')" = "${RELEASE_VERSION#v}"
      - name: prepare native user service environment
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo loginctl enable-linger "$(id -u)"
            sudo systemctl start "user@$(id -u).service"
            echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            launchctl print "gui/$(id -u)" >/dev/null
          fi
      - name: install portable PTY verification dependencies
        run: pnpm install --frozen-lockfile
      - name: native background Host and independent PTY workflows
        run: node script/smoke-platform-pty.mjs
      - name: verify five installed versions and managed profile
        shell: bash
        run: node script/verify-installed-mayfly.mjs "${RELEASE_VERSION#v}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-pty-${{ runner.os }}
          path: .artifacts/platform-pty

  promote:
    name: promote release channel
    needs: [candidate, registry-install]
    if: ${{ always() && !contains(inputs.version || github.ref_name, '-test.') && (inputs.promote_only == true || needs.registry-install.result == 'success') }}
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: verify promote-only source run
        if: ${{ inputs.promote_only == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          test -n "$SOURCE_RUN_ID"
          gh run view "$SOURCE_RUN_ID" --json headSha,workflowName,jobs | node script/promotion-source.mjs "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: .artifacts/pack
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - run: node script/release-preflight.mjs --artifact "${RELEASE_VERSION#v}"
      - run: node script/release-packages.mjs promote
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
